name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + jsx-a11y)
        run: npm run lint
      - name: Lint CSS (token enforcement)
        run: npm run lint:css
      - name: Type check
        run: npm run typecheck
      - name: Unit and accessibility tests
        run: npm test
      - name: Build
        run: npm run build
